services:
  - type: web
    name: tribune
    runtime: node
    plan: starter
    buildCommand: echo "Aucune dependance a installer"
    startCommand: npm start
    healthCheckPath: /api/health
    envVars:
      - key: DATA_DIR
        value: /var/data
    disk:
      name: tribune-data
      mountPath: /var/data
      sizeGB: 1
