services:
  - type: web
    name: tribune
    runtime: node
    plan: starter
    buildCommand: echo "Aucune dépendance à installer"
    startCommand: npm start
    healthCheckPath: /api/health
    envVars:
      - key: VAPID_SUBJECT
        value: mailto:toi@exemple.fr
      - key: VAPID_PUBLIC_KEY
        sync: false
      - key: VAPID_PRIVATE_KEY
        sync: false
      - key: DATA_DIR
        value: /var/data
    disk:
      name: tribune-data
      mountPath: /var/data
      sizeGB: 1
